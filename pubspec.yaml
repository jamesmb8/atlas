name: atlas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  flutter_riverpod: ^3.2.0
  dio: ^5.9.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  apple_maps_flutter: ^1.4.0
  flutter_svg: ^2.2.3
  intl: ^0.20.2
  sign_in_with_apple: ^7.0.1
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  provider: ^6.0.0
  cloud_functions: ^6.0.0
  url_launcher: ^6.3.0
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/atlas_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

  fonts:
    - family: LineSeedJP
      fonts:
        - asset: assets/fonts/LINESeedJP-Thin.ttf
          weight: 100
        - asset: assets/fonts/LINESeedJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/LINESeedJP-Bold.ttf
          weight: 700
        - asset: assets/fonts/LINESeedJP-ExtraBold.ttf
          weight: 800